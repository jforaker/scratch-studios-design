<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scratch Studios Style Guide</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lay text; there is no red ground.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"type\" data-screen-label=\"04 Type\" style=\"border-top:1px solid var(--g-ink,#161616);padding:44px 0 72px;display:flex;flex-wrap:wrap;gap:28px 48px\">\n  <div style=\"flex:1 1 200px;max-width:260px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">04 — Type<\u002Fdiv>\n    <h2 style=\"margin:0;font-weight:300;font-size:32px;line-height:1.1;letter-spacing:-.01em\">Big and light. Small and spaced.<\u002Fh2>\n    <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">Three voices and a mark: a grotesk that speaks, a mono that labels, light numerals that measure, and a typewriter for the name on the door.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n      <div style=\"background:var(--g-raised,#FCFBF8);border:1px solid var(--g-rule,rgba(22,22,22,.12));padding:22px;display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Voice 1 — Grotesk<\u002Fspan>\n        <span style=\"font-size:26px;font-weight:400;line-height:1.2;letter-spacing:-.005em;text-wrap:pretty;flex:1\">Download is 21% lower than your reference.<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:12px\"><span style=\"font-size:14px;font-weight:500\">Barlow<\u002Fspan><span style=\"font-size:12.5px;color:var(--g-label,#73706A);line-height:1.45\">Headings, body, place names. Drawn from California road signs and plates.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--g-raised,#FCFBF8);border:1px solid var(--g-rule,rgba(22,22,22,.12));padding:22px;display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Voice 2 — Label mono<\u002Fspan>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;font-family:'IBM Plex Mono',ui-monospace,monospace;text-transform:uppercase\"><span style=\"font-size:15px;letter-spacing:.18em\">Connection quality<\u002Fspan><span style=\"font-size:15px;letter-spacing:.18em;font-weight:600\">Measuring<\u002Fspan><span style=\"font-size:15px;letter-spacing:.18em;color:var(--g-label,#73706A)\">Read ⌘1<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:12px\"><span style=\"font-size:14px;font-weight:500\">IBM Plex Mono<\u002Fspan><span style=\"font-size:12.5px;color:var(--g-label,#73706A);line-height:1.45\">Labels, units, metadata. Always caps, always tracked.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--g-raised,#FCFBF8);border:1px solid var(--g-rule,rgba(22,22,22,.12));padding:22px;display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Voice 3 — Numerals<\u002Fspan>\n        <div style=\"flex:1;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap\"><span style=\"font-family:var(--num-trace,'IBM Plex Mono'),monospace;font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em\">372.1<\u002Fspan><span style=\"font-family:var(--num-break,'Barlow'),sans-serif;font-weight:300;font-size:56px;line-height:1;letter-spa 7px;height:7px;border-radius:50%;background:var(--g-sand,#D8D3C9)\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:50%;background:var(--g-sand,#D8D3C9)\"><\u002Fspan><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--g-ochre,#7C5D29)\">FAIR<\u002Fspan><\u002Fdiv>\n          <span style=\"font-size:13px;color:var(--g-label,#73706A)\">Best 11 PM–12 AM<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"grid-column:1/-1;border:1px solid var(--g-rule,rgba(22,22,22,.12));display:flex;flex-direction:column;min-width:0\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 16px;background:var(--g-raised,#FCFBF8);border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12));font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase\"><span>05.8 Settings rows<\u002Fspan><span style=\"color:var(--g-label,#73706A)\">Scratch<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--g-ground,#F6F5F1);flex:1;padding:4px 20px 8px;display:flex;flex-direction:column;color:var(--g-ink,#161616)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n          <span style=\"font-size:14px;font-weight:500\">Theme<\u002Fspan>\n          <div style=\"display:flex;padding:2px;border:1px solid var(--g-rule14,rgba(22,22,22,.14));border-radius:7px;background:var(--g-track,#EDEAE3);font-size:12.5px\"><span style=\"padding:4px 11px;border-radius:5px;background:var(--g-raised,#FCFBF8);font-weight:600\">System<\u002Fspan><span style=\"padding:4px 11px;border-radius:5px;color:var(--g-inksoft,#4A4843)\">Paper<\u002Fspan><span style=\"padding:4px 11px;border-radius:5px;color:var(--g-inksoft,#4A4843)\">Night<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n          <span style=\"font-size:14px;font-weight:500\">Editor text size<\u002Fspan>\n          <div style=\"display:flex;align-items:center;border:1px solid var(--g-rule14,rgba(22,22,22,.14));border-radius:7px;font-size:13px\"><span style=\"width:30px;height:28px;display:grid;place-items:center;color:var(--g-inksoft,#4A4843)\">−<\u002Fspan><span style=\"width:34px;text-align:center;font-family:var(--num-trace,'IBM Plex Mono'),monospace;font-weight:400\">16<\u002Fspan><span style=\"width:30px;height:28px;display:grid;place-items:center;color:var(--g-inksoft,#4A4843)\">+<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:13px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px\">\n            <span style=\"font-size:14px;font-weight:500\">Editor font<\u002Fspan>\n            <div style=\"display:flex;padding:2px;border:1px solid var(--g-rule14,rgba(22,22,22,.14));border-radius:7px;background:var(--g-track,#EDEAE3);font-size:12.5px\"><span style=\"padding:4px 11px;border-radius:5px;color:var(--g-inksoft,#4A4843);white-space:nowrap\">Plex Mono<\u002Fspan><span style=\"padding:4px 11px;border-radius:5px;color:var(--g-inksoft,#4A4843)\">Barlow<\u002Fspan><span style=\"padding:4px 11px;border-radius:5px;background:var(--g-raised,#FCFBF8);font-weight:600;white-space:nowrap\">Courier Prime<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Courier Prime',ui-monospace,monospace;font-size:14px;line-height:1.55;color:var(--g-body,#2E2C29)\">Scratch Studios makes calm, quiet software.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n          <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Mark as Forgotten after<\u002Fspan><span style=\"font-size:12.5px;color:var(--g-label,#73706A)\">Untouched scratches move out of your way<\u002Fspan><\u002Fdiv>\n          <span style=\"flex:none;padding:5px 10px;border:1px solid var(--g-rule14,rgba(22,22,22,.14));border-radius:7px;font-size:12.5px;font-weight:500\">60 days ⌄<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0\">\n          <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"font-size:14px;font-weight:500\">Notes on disk<\u002Fspan><span style=\"font-size:12.5px;color:var(--g-label,#73706A)\">Plain markdown files<\u002Fspan><\u002Fdiv>\n          <span style=\"flex:none;padding:5px 12px;border:1px solid var(--g-rule20,rgba(22,22,22,.2));border-radius:7px;font-size:12.5px;font-weight:500\">Reveal in Finder<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rules\" data-screen-label=\"06 Rules\" style=\"border-top:1px solid var(--g-ink,#161616);padding:44px 0 72px;display:flex;flex-wrap:wrap;gap:28px 48px\">\n  <div style=\"flex:1 1 200px;max-width:260px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">06 — Rules<\u002Fdiv>\n    <h2 style=\"margin:0;font-weight:300;font-size:32px;line-height:1.1;letter-spacing:-.01em\">Hairlines, not boxes.<\u002Fh2>\n    <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">How things are separated, spaced, rounded and moved.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:999 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px 28px\">\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.1 Hairlines<\u002Fspan>\n      <div style=\"height:76px;display:grid;grid-template-columns:1fr 1fr\">\n        <div style=\"background:var(--g-raised,#FCFBF8);display:flex;flex-direction:column;justify-content:space-evenly;padding:0 12px\"><span style=\"height:1px;background:var(--g-rule,rgba(22,22,22,.12))\"><\u002Fspan><span style=\"height:1px;background:var(--g-rule,rgba(22,22,22,.12))\"><\u002Fspan><span style=\"height:1px;background:var(--g-rule,rgba(22,22,22,.12))\"><\u002Fspan><\u002Fdiv>\n        <div style=\"background:#111110;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 12px\"><span style=\"height:1px;background:rgba(255,255,255,.1)\"><\u002Fspan><span style=\"height:1px;background:rgba(255,255,255,.1)\"><\u002Fspan><span style=\"height:1px;background:rgba(255,255,255,.1)\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">1px only. Ink at 12% on paper, white at 10% on night. Full rules divide; partial edges never highlight.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.2 Spacing<\u002Fspan>\n      <div style=\"height:76px;display:flex;align-items:flex-end;gap:8px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:4px;height:4px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">8<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:12px;height:12px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">12<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:16px;height:16px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">16<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:24px;height:24px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">24<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:32px;height:32px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">32<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:48px;height:48px;background:var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--g-label,#73706A)\">48<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">4-pt base. Rows breathe at 12–16, blocks at 24–32, sections at 48–64.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.3 Radius<\u002Fspan>\n      <div style=\"height:76px;display:flex;align-items:center;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:38px;height:38px;border:1px solid var(--g-ink,#161616)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--g-label,#73706A)\">0<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:38px;height:38px;border:1px solid var(--g-ink,#161616);border-radius:2px\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--g-label,#73706A)\">2<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:38px;height:38px;border:1px solid var(--g-ink,#161616);border-radius:7px\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--g-label,#73706A)\">7<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><span style=\"width:38px;height:38px;border:1px solid var(--g-ink,#161616);border-radius:999px\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--g-label,#73706A)\">FULL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">Panels and rows are square. Desktop controls take 7. Pills, dots and ring buttons go fully round.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.4 Elevation<\u002Fspan>\n      <div style=\"height:76px;background:#111110;display:grid;grid-template-columns:1fr 2fr\">\n        <div style=\"background:#1C1C1A;border-right:1px solid rgba(255,255,255,.1)\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;justify-content:center;padding:0 14px;gap:8px\"><span style=\"height:1px;background:rgba(255,255,255,.1)\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;color:#8C8A84\">GRAPHITE · NIGHT<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">None. Layers separate by a ground shift and a hairline — no shadows, no blur, no glass.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.5 Motion<\u002Fspan>\n      <div style=\"height:76px;display:flex;flex-direction:column;justify-content:center;gap:10px\">\n        <div style=\"position:relative;height:9px\">\n          <span style=\"position:absolute;left:0;right:0;top:4px;height:1px;background:var(--g-rule18,rgba(22,22,22,.18))\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:0%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:33%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:58%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:76%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:87.5%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:95%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n          <span style=\"position:absolute;top:1px;left:100%;width:7px;height:7px;border-radius:50%;background:var(--g-ink,#161616);transform:translateX(-50%)\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--g-label,#73706A)\"><span>0 MS<\u002Fspan><span>EASE-OUT<\u002Fspan><span>160 MS<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">Short and settling. Numbers count, they don’t bounce. Only a live dot loops.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:16px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">06.6 Charts<\u002Fspan>\n      <div style=\"height:76px;background-image:radial-gradient(var(--g-rule20,rgba(22,22,22,.2)) 1px,transparent 1.3px);background-size:24px 24px;position:relative\">\n        <svg viewBox=\"0 0 240 76\" preserveAspectRatio=\"none\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><polyline points=\"0,52 30,48 62,47 92,58 122,26 156,28 186,20 240,24\" fill=\"none\" stroke=\"var(--g-nominal,#4C6A55)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"/><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">A 1px line in the app’s accent over a dot grid. Fill fades from 20% to nothing. A marked span sits on Window between two hairlines. Labels sit outside the plot.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"voice\" data-screen-label=\"07 Voice\" style=\"border-top:1px solid var(--g-ink,#161616);padding:44px 0 72px;display:flex;flex-wrap:wrap;gap:28px 48px\">\n  <div style=\"flex:1 1 200px;max-width:260px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">07 — Voice<\u002Fdiv>\n    <h2 style=\"margin:0;font-weight:300;font-size:32px;line-height:1.1;letter-spacing:-.01em\">Say what the instrument sees.<\u002Fh2>\n    <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--g-inksoft,#4A4843);text-wrap:pretty\">Plain sentences. No cheerleading.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:36px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 28px\">\n      <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:14px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;color:var(--g-label,#73706A)\">07.1<\u002Fspan><span style=\"font-size:19px\">Numbers before adjectives.<\u002Fspan><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:14px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;color:var(--g-label,#73706A)\">07.2<\u002Fspan><span style=\"font-size:19px\">Sentence case. Full stops.<\u002Fspan><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--g-rule,rgba(22,22,22,.12));padding-top:14px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;color:var(--g-label,#73706A)\">07.3<\u002Fspan><span style=\"font-size:19px\">No exclamation marks, no emoji.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--g-ink,#161616)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 32px;padding:18px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">Write<\u002Fspan><span style=\"font-size:17px;line-height:1.4\">Changes apply immediately. There is no Save button.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Not<\u002Fspan><span style=\"font-size:17px;line-height:1.4;color:var(--g-label,#73706A);text-decoration:line-through;text-decoration-color:var(--g-rule20,#C9C4BA)\">Don’t worry — we’ll auto-save everything for you!<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 32px;padding:18px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">Write<\u002Fspan><span style=\"font-size:17px;line-height:1.4\">Download is 21% lower than your reference.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Not<\u002Fspan><span style=\"font-size:17px;line-height:1.4;color:var(--g-label,#73706A);text-decoration:line-through;text-decoration-color:var(--g-rule20,#C9C4BA)\">Uh oh! Your internet seems kind of slow today.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 32px;padding:18px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">Write<\u002Fspan><span style=\"font-size:17px;line-height:1.4\">Bandwidth readings transfer data. Avoid repeated tests on metered connections.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Not<\u002Fspan><span style=\"font-size:17px;line-height:1.4;color:var(--g-label,#73706A);text-decoration:line-through;text-decoration-color:var(--g-rule20,#C9C4BA)\">Heads up!! Speed tests can use LOTS of data.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 32px;padding:18px 0;border-bottom:1px solid var(--g-rule,rgba(22,22,22,.12))\">\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sa,#334A94)\">Write<\u002Fspan><span style=\"font-size:17px;line-height:1.4\">Calm wind throughout the window. Expect 2–3 ft surf.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:8px\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Not<\u002Fspan><span style=\"font-size:17px;line-height:1.4;color:var(--g-label,#73706A);text-decoration:line-through;text-decoration-color:var(--g-rule20,#C9C4BA)\">Epic session incoming — don’t miss out!<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid var(--g-ink,#161616);padding:22px 0 48px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 24px\">\n  <span style=\"font-size:13px;font-family:'Cutive Mono',ui-monospace,monospace;font-weight:400;letter-spacing:.42em;text-transform:uppercase\">Scratch Studios<\u002Fspan>\n  <span style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--g-label,#73706A)\">Edition 03 · Barlow &amp; Cutive<\u002Fspan>\n  <span style=\"font-size:13px;color:var(--g-label,#73706A)\">Software worth keeping.<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n    \n<\u002Fx-dc>\n<script>\n(function(){\n  var KEY='ss-guide-theme';\n  function sys(){return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'night':'paper';}\n  function cur(){return document.documentElement.getAttribute(
