<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  html, body { margin: 0; height: 288px; background: var(--ground); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .ink { fill: var(--ink); }
  .kelp { fill: var(--nominal); }
  .cyan { fill: var(--scratch-accent); }
  .clay { fill: var(--clay); }
  .ochre { fill: var(--phosphor); }
  .dot { fill: var(--ground); }
  .text { position: absolute; left: 48px; bottom: 40px; max-width: 420px; }
  .name { margin: 0; font-family: "Barlow", system-ui, sans-serif; font-weight: 300; font-size: 92px; line-height: .95; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: 16px 0 0; font-family: "Barlow", system-ui, sans-serif; font-size: 13px; line-height: 1.5; color: var(--label); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: ink 192x192, nominal 192x192, scratch-accent 96x288, clay 96x96, phosphor 96x48 (all space-12 multiples)
      arrangement: flush modular grid on a 96 module, staggered, cyanotype slab bleeding off the right edge
      pattern: dot grid at space-6 pitch cut from the ground into the ink block; "precise, mono, a 4px grid" and the charts' dot-grid plot
      steps and radii: space-12 (48) module, space-6 (24) pitch, radius-none corners, radius-round dots
    -->
    <rect class="ink" x="480" y="96" width="192" height="192"/>
    <rect class="kelp" x="672" y="0" width="192" height="192"/>
    <rect class="cyan" x="864" y="0" width="96" height="288"/>
    <rect class="clay" x="672" y="192" width="96" height="96"/>
    <rect class="ochre" x="768" y="240" width="96" height="48"/>
    <g class="dot">
      <circle cx="504" cy="120" r="1.5"/><circle cx="528" cy="120" r="1.5"/><circle cx="552" cy="120" r="1.5"/><circle cx="576" cy="120" r="1.5"/><circle cx="600" cy="120" r="1.5"/><circle cx="624" cy="120" r="1.5"/><circle cx="648" cy="120" r="1.5"/>
      <circle cx="504" cy="144" r="1.5"/><circle cx="528" cy="144" r="1.5"/><circle cx="552" cy="144" r="1.5"/><circle cx="576" cy="144" r="1.5"/><circle cx="600" cy="144" r="1.5"/><circle cx="624" cy="144" r="1.5"/><circle cx="648" cy="144" r="1.5"/>
      <circle cx="504" cy="168" r="1.5"/><circle cx="528" cy="168" r="1.5"/><circle cx="552" cy="168" r="1.5"/><circle cx="576" cy="168" r="1.5"/><circle cx="600" cy="168" r="1.5"/><circle cx="624" cy="168" r="1.5"/><circle cx="648" cy="168" r="1.5"/>
      <circle cx="504" cy="192" r="1.5"/><circle cx="528" cy="192" r="1.5"/><circle cx="552" cy="192" r="1.5"/><circle cx="576" cy="192" r="1.5"/><circle cx="600" cy="192" r="1.5"/><circle cx="624" cy="192" r="1.5"/><circle cx="648" cy="192" r="1.5"/>
      <circle cx="504" cy="216" r="1.5"/><circle cx="528" cy="216" r="1.5"/><circle cx="552" cy="216" r="1.5"/><circle cx="576" cy="216" r="1.5"/><circle cx="600" cy="216" r="1.5"/><circle cx="624" cy="216" r="1.5"/><circle cx="648" cy="216" r="1.5"/>
      <circle cx="504" cy="240" r="1.5"/><circle cx="528" cy="240" r="1.5"/><circle cx="552" cy="240" r="1.5"/><circle cx="576" cy="240" r="1.5"/><circle cx="600" cy="240" r="1.5"/><circle cx="624" cy="240" r="1.5"/><circle cx="648" cy="240" r="1.5"/>
      <circle cx="504" cy="264" r="1.5"/><circle cx="528" cy="264" r="1.5"/><circle cx="552" cy="264" r="1.5"/><circle cx="576" cy="264" r="1.5"/><circle cx="600" cy="264" r="1.5"/><circle cx="624" cy="264" r="1.5"/><circle cx="648" cy="264" r="1.5"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Scratch<br>Studios</h1>
    <p class="tag">Quiet, instrument-like software. Calm, precise, analog.</p>
  </div>
</div>
</body>
</html>
