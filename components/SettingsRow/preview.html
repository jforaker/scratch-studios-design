<!-- @dsCard group="Controls" height=200 subtitle="Segmented control, stepper, menu" -->
<div id="root">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Cutive+Mono&family=IBM+Plex+Mono:wght@300;400;500&display=swap">
<style>
  body{margin:0;background:var(--ground)}
  .pair{display:grid;grid-template-columns:1fr 1fr}
  .pane{background:var(--ground);color:var(--ink);font-family:var(--font-grotesk,"Barlow",system-ui,sans-serif);min-width:0}
  .head{display:flex;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--rule)}
  .lbl{font-family:var(--font-mono,"IBM Plex Mono",monospace);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
  .break{--acc:var(--nominal);--sel:var(--nominal-selection);--fill:var(--nominal-chart-fill)}
  .trace{--acc:var(--phosphor);--sel:var(--phosphor-selection);--fill:var(--phosphor-chart-fill)}
  .scratch{--acc:var(--scratch-accent);--sel:var(--scratch-selection);--fill:var(--scratch-chart-fill)}
  .mono{font-family:var(--font-mono,"IBM Plex Mono",monospace)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

</style>
<div class="pair"><div class="pane scratch" data-theme="light"><div class="head"><span class="lbl">Settings rows</span><span class="lbl">Scratch · Paper</span></div><div style="padding:0 20px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)"><span style="font-size:14px;font-weight:500">Theme</span><div style="display:flex;padding:2px;border:1px solid var(--rule-strong);border-radius:7px;background:var(--track);font-size:12.5px"><span style="padding:4px 11px;border-radius:5px;color:var(--ink-soft)">System</span><span style="padding:4px 11px;border-radius:5px;background:var(--raised);font-weight:500;color:var(--ink)">Paper</span><span style="padding:4px 11px;border-radius:5px;color:var(--ink-soft)">Night</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)"><span style="font-size:14px;font-weight:500">Editor text size</span><div style="display:flex;align-items:center;border:1px solid var(--rule-strong);border-radius:7px;font-size:13px"><span style="width:28px;height:26px;display:grid;place-items:center;color:var(--ink-soft)">−</span><span class="mono" style="width:30px;text-align:center">16</span><span style="width:28px;height:26px;display:grid;place-items:center;color:var(--ink-soft)">+</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0"><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:14px;font-weight:500">Mark as forgotten after</span><span style="font-size:12.5px;color:var(--ink-soft)">Untouched scratches move out of your way.</span></div><span style="flex:none;padding:5px 10px;border:1px solid var(--rule-strong);border-radius:7px;font-size:12.5px;font-weight:500">60 days ⌄</span></div></div></div><div class="pane scratch" data-theme="dark"><div class="head"><span class="lbl">Settings rows</span><span class="lbl">Scratch · Night</span></div><div style="padding:0 20px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)"><span style="font-size:14px;font-weight:500">Theme</span><div style="display:flex;padding:2px;border:1px solid var(--rule-strong);border-radius:7px;background:var(--track);font-size:12.5px"><span style="padding:4px 11px;border-radius:5px;color:var(--ink-soft)">System</span><span style="padding:4px 11px;border-radius:5px;color:var(--ink-soft)">Paper</span><span style="padding:4px 11px;border-radius:5px;background:var(--raised);font-weight:500;color:var(--ink)">Night</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)"><span style="font-size:14px;font-weight:500">Editor text size</span><div style="display:flex;align-items:center;border:1px solid var(--rule-strong);border-radius:7px;font-size:13px"><span style="width:28px;height:26px;display:grid;place-items:center;color:var(--ink-soft)">−</span><span class="mono" style="width:30px;text-align:center">16</span><span style="width:28px;height:26px;display:grid;place-items:center;color:var(--ink-soft)">+</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0"><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:14px;font-weight:500">Mark as forgotten after</span><span style="font-size:12.5px;color:var(--ink-soft)">Untouched scratches move out of your way.</span></div><span style="flex:none;padding:5px 10px;border:1px solid var(--rule-strong);border-radius:7px;font-size:12.5px;font-weight:500">60 days ⌄</span></div></div></div></div>
</div>
<script>/* static preview */</script>
