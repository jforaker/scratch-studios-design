<!-- @dsCard group="Navigation" height=310 subtitle="Sidebar, active item on the selection ground" -->
<div id="root">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Cutive+Mono&family=IBM+Plex+Mono:wght@300;400;500&display=swap">
<style>
  body{margin:0;background:var(--ground)}
  .pair{display:grid;grid-template-columns:1fr 1fr}
  .pane{background:var(--ground);color:var(--ink);font-family:var(--font-grotesk,"Barlow",system-ui,sans-serif);min-width:0}
  .head{display:flex;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--rule)}
  .lbl{font-family:var(--font-mono,"IBM Plex Mono",monospace);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
  .break{--acc:var(--nominal);--sel:var(--nominal-selection);--fill:var(--nominal-chart-fill)}
  .trace{--acc:var(--phosphor);--sel:var(--phosphor-selection);--fill:var(--phosphor-chart-fill)}
  .scratch{--acc:var(--scratch-accent);--sel:var(--scratch-selection);--fill:var(--scratch-chart-fill)}
  .mono{font-family:var(--font-mono,"IBM Plex Mono",monospace)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

</style>
<div class="pair"><div class="pane trace" data-theme="light"><div class="head"><span class="lbl">Navigation</span><span class="lbl">Trace · Paper</span></div><div style="background:var(--raised);padding:18px 10px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--rule)">
<div style="padding:0 14px;display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--font-mark,'Cutive Mono',monospace);font-size:15px;letter-spacing:.42em">TRACE</span><span class="lbl" style="font-size:9px;letter-spacing:.2em">Network analyzer</span></div>
<div style="display:flex;flex-direction:column;gap:2px"><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--sel);color:var(--ink)"><span>Read</span><span style="color:var(--ink-soft)">⌘1</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Watch</span><span style="color:var(--label)">⌘2</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>History</span><span style="color:var(--label)">⌘3</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Insights</span><span style="color:var(--label)">⌘4</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Settings</span><span style="color:var(--label)">⌘5</span></div></div></div></div><div class="pane trace" data-theme="dark"><div class="head"><span class="lbl">Navigation</span><span class="lbl">Trace · Night</span></div><div style="background:var(--raised);padding:18px 10px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--rule)">
<div style="padding:0 14px;display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--font-mark,'Cutive Mono',monospace);font-size:15px;letter-spacing:.42em">TRACE</span><span class="lbl" style="font-size:9px;letter-spacing:.2em">Network analyzer</span></div>
<div style="display:flex;flex-direction:column;gap:2px"><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;background:var(--sel);color:var(--ink)"><span>Read</span><span style="color:var(--ink-soft)">⌘1</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Watch</span><span style="color:var(--label)">⌘2</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>History</span><span style="color:var(--label)">⌘3</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Insights</span><span style="color:var(--label)">⌘4</span></div><div class="mono" style="display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label)"><span>Settings</span><span style="color:var(--label)">⌘5</span></div></div></div></div></div>
</div>
<script>/* static preview */</script>
